base_model: google/gemma-4-26b-a4b-it
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# Gemma 4 Architecture & Attention Optimization
attn_implementation: sdpa
gemma4_hybrid_attn_impl: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# Fully qualified: bare suffixes like gate_proj also match the vision tower, whose
# Gemma4ClippableLinear wrappers break both PEFT merge_lora and SGLang's / vLLM's adapter loader.
lora_target_modules: 'model\.language_model\.layers\.[\d]+\.(_checkpoint_wrapped_module\.)?(mlp|self_attn)\.(up|down|gate|q|k|v|o)_proj'

# Set to standard lora since the base model is unquantized bfloat16
adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

# Precision architecture tailored for modern compute architectures (L40S / Hopper / Ada)
bf16: true
fp16: false
tf32: true

unsloth: false
load_in_8bit: false # Disabled: Fits natively sharded under ZeRO-3
load_in_4bit: false
qlora_sharded_model_loading: false

# Liger Kernel Acceleration
plugins:
  - axolotl.integrations.liger.LigerPlugin

liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_layer_norm: true
liger_fused_linear_cross_entropy: true

# Turn boundaries. NOT '<end_of_turn>' -- that is the Gemma 3 spelling and does not exist
# in Gemma 4, where it tokenizes as 7 pieces of ordinary text. Gemma 4 ends a turn with
# '<turn|>' (id 106), which is also the second entry in the model's own
# eos_token_id: [1, 106]. Naming a token that is not in the chat template means Axolotl
# never trains the terminator, so the adapter may not learn to stop.
special_tokens:
  eos_token: "<eos>"
eot_tokens:
  - "<turn|>"

# Dataset Configuration
# Initial fast verification uses dataset_train_sample.jsonl (8 samples).
# Switch path to data/dataset_train.jsonl for full training.
datasets:
  - path: data/dataset_train_sample.jsonl
    type: chat_template
    chat_template: tokenizer_default
    field_messages: messages
    message_property_mappings:
      role: role
      content: content

# Sequence and Batch Dimensions
sequence_len: 8192
sample_packing: false
pad_to_sequence_len: false

micro_batch_size: 1
gradient_accumulation_steps: 2

# Training Schedule (1 epoch for smoke test, switch to 3 epochs for full run)
num_epochs: 1
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.01

# DeepSpeed Memory & Sharding Optimizations
deepspeed: src-train/deepspeed_zero3.json
deepspeed_cpu_checkpointing: true
deepspeed_param_persistence_threshold: 0
deepspeed_offload_param: true
deepspeed_offload_optimizer: true

# Output and Logging
logging_steps: 1
save_strategy: "epoch"
output_dir: ./local/adapters/gemma-4-26b-a4b-it-lora
